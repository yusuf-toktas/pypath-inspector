[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypath-inspector"
version = "0.1.0"
description = "A local-first, strictly read-only Python environment diagnostic tool for Windows, Linux and macOS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "PyPath Inspector contributors" },
]
keywords = ["python", "path", "diagnostics", "doctor", "environment", "pip", "venv", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yusuf-toktas/pypath-inspector"
Issues = "https://github.com/yusuf-toktas/pypath-inspector/issues"

[project.scripts]
pypath = "pypath_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
