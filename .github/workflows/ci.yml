name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test the CLI
        shell: pwsh
        run: |
          pypath --version
          pypath doctor --format json --output report.json
          pypath doctor --format markdown --output report.md
          if ($LASTEXITCODE -gt 2) { exit 1 }
          python -c "import json; json.load(open('report.json', encoding='utf-8')); print('report.json is valid JSON')"
