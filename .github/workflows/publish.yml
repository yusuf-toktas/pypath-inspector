name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to publish
        required: true
        default: v0.1.0
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          mkdir -p release-assets dist

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --pattern "SHA256SUMS.txt"

          VERSION="${RELEASE_TAG#v}"
          WHEEL="pypath_inspector-${VERSION}-py3-none-any.whl"
          SDIST="pypath_inspector-${VERSION}.tar.gz"

          test -f "release-assets/$WHEEL"
          test -f "release-assets/$SDIST"
          test -f "release-assets/SHA256SUMS.txt"

          ASSET_COUNT="$(find release-assets -maxdepth 1 -type f | wc -l)"
          test "$ASSET_COUNT" -eq 3

          python - "$WHEEL" "$SDIST" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          root = Path("release-assets")
          expected = {sys.argv[1], sys.argv[2]}
          entries = {}

          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/\\]+)", line)
              if match is None:
                  raise SystemExit(f"Invalid checksum line: {line!r}")
              digest, filename = match.groups()
              if filename in entries:
                  raise SystemExit(f"Duplicate checksum entry: {filename}")
              entries[filename] = digest

          if set(entries) != expected:
              raise SystemExit(
                  f"Checksum manifest entries mismatch: expected {sorted(expected)}, "
                  f"got {sorted(entries)}"
              )

          for filename, expected_digest in entries.items():
              actual_digest = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"SHA-256 mismatch: {filename}")
              print(f"Verified SHA-256: {filename}")

          if {path.name for path in root.iterdir()} != expected | {"SHA256SUMS.txt"}:
              raise SystemExit("Unexpected files found in downloaded release assets")
          PY

          cp "release-assets/$WHEEL" dist/
          cp "release-assets/$SDIST" dist/

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypath-release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pypath-inspector/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypath-release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
